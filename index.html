<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Control de Glucosa</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2f7d5e" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Vista de login / registro: visible cuando NO hay sesión -->
  <section id="auth-view">
    <h1>Control de Glucosa</h1>

    <form id="login-form">
      <h2>Iniciar sesión</h2>
      <input type="email" id="login-email" placeholder="Email" required />
      <input type="password" id="login-password" placeholder="Contraseña" required />
      <button type="submit">Entrar</button>
    </form>

    <form id="register-form">
      <h2>Crear cuenta</h2>
      <input type="email" id="register-email" placeholder="Email" required />
      <input type="password" id="register-password" placeholder="Contraseña (mínimo 6 caracteres)" required />
      <button type="submit">Registrarme</button>
    </form>

    <p id="auth-message"></p>
  </section>

  <!-- Vista de configuración inicial: visible cuando hay sesión pero NO hay perfil -->
  <section id="setup-view" hidden>
    <h1>Configura tu perfil</h1>

    <div class="setup-step" id="setup-step-1">
      <h2>Paso 1 de 5: ¿Cómo te llamas?</h2>
      <input type="text" id="setup-nombre" placeholder="Tu nombre" />
      <button type="button" id="setup-next-1">Siguiente</button>
    </div>

    <div class="setup-step" id="setup-step-2" hidden>
      <h2>Paso 2 de 5: ¿Qué tipo de diabetes tienes?</h2>
      <select id="setup-tipo">
        <option value="tipo1">Tipo 1</option>
        <option value="tipo2">Tipo 2</option>
        <option value="otro">Otro</option>
      </select>
      <button type="button" id="setup-next-2">Siguiente</button>
    </div>

    <div class="setup-step" id="setup-step-3" hidden>
      <h2>Paso 3 de 5: ¿Cuántos años tienes?</h2>
      <input type="number" id="setup-anios" min="0" max="100" />
      <button type="button" id="setup-next-3">Siguiente</button>
    </div>


  </section>

  <!-- Vista principal: visible cuando SÍ hay sesión -->
  <section id="app-view" hidden>
    <header>
      <h1>Control de Glucosa</h1>
      <button id="logout-button">Cerrar sesión</button>
    </header>
    <main id="app">
      <p>Sesión iniciada. Aquí irá el gráfico, el formulario de mediciones y el calendario.</p>
    </main>
  </section>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
